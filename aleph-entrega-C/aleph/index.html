<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aleph</title>
  <style>
    :root{
      box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px);
      color-scheme: light dark;
      --h:232;
      --bg:#f6f7f9;
      --sf:#fff;
      --sf2:#eceef2;
      --tx:#16181d;
      --tx2:#5f6672;
      --bd:#dfe2e8;
      --ac:hsl(var(--h) 58% 46%);
      --acs:hsl(var(--h) 60% 50%/.12);
      --ok:#23885a;
      --wa:#b86a14;
      --da:#c93a3a;
      --serif:Georgia,"Source Serif 4","Times New Roman",serif;
      --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      --sw:288px;
    }
    @media(prefers-color-scheme:dark){
      :root:not([data-theme="light"]){
        --bg:#101216;
        --sf:#171a20;
        --sf2:#20242c;
        --tx:#e9ebf0;
        --tx2:#98a0ad;
        --bd:#2a2f38;
        --ac:hsl(var(--h) 80% 72%);
        --acs:hsl(var(--h) 80% 70%/.16);
        --ok:#4cc38a;
        --wa:#e0a04f;
        --da:#e8685f;
      }
    }
    :root[data-theme="dark"]{
      --bg:#101216;
      --sf:#171a20;
      --sf2:#20242c;
      --tx:#e9ebf0;
      --tx2:#98a0ad;
      --bd:#2a2f38;
      --ac:hsl(var(--h) 80% 72%);
      --acs:hsl(var(--h) 80% 70%/.16);
      --ok:#4cc38a;
      --wa:#e0a04f;
      --da:#e8685f;
    }
    *,*::before,*::after{box-sizing:inherit}
    html,body{height:100%;margin:0}
    body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
    button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
    :focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:6px}
    .ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .app{display:flex;height:100%}
    .sb{width:var(--sw);background:var(--sf);border-right:1px solid var(--bd);display:flex;flex-direction:column;position:relative;flex:none}
    .rs{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
    .rs:hover,.rs.on{background:linear-gradient(90deg,transparent 3px,var(--ac) 3px,var(--ac) 5px,transparent 5px)}
    .sb-h{display:flex;align-items:center;gap:10px;padding:14px 14px 8px}
    .logo{width:26px;height:26px;color:var(--ac);flex:none}
    .ws{flex:1;text-align:left;font:600 15px var(--serif);display:flex;align-items:center;gap:6px;min-width:0}
    .btn-i{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:var(--tx2)}
    .btn-i:hover{background:var(--sf2);color:var(--tx)}
    .nav{padding:4px 8px}
    .nv{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px;border-radius:7px;color:var(--tx2);text-align:left}
    .nv:hover{background:var(--sf2);color:var(--tx)}
    .sep{height:1px;background:var(--bd);margin:6px 14px}
    .tree{flex:1;overflow:auto;padding:2px 8px}
    .row{display:flex;align-items:center;gap:6px;height:30px;padding-right:6px;border-radius:7px;cursor:pointer;color:var(--tx);position:relative}
    .row:hover{background:var(--sf2)}
    .row[aria-selected=true]{background:var(--acs)}
    .row[aria-selected=true] .t{color:var(--ac);font-weight:600}
    .row .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--serif);font-size:14.5px}
    .chv{width:18px;height:18px;display:grid;place-items:center;color:var(--tx2);border-radius:5px}
    .chv:hover{background:var(--bd)}
    .chv .ic{width:13px;height:13px;transition:transform .15s}
    [aria-expanded=true]>.row .chv .ic{transform:rotate(90deg)}
    .chv.no{visibility:hidden}
    .acts{display:none;gap:2px;color:var(--tx2)}
    .row:hover .acts,.row:focus-visible .acts{display:flex}
    .acts span{width:22px;height:22px;display:grid;place-items:center;border-radius:5px}
    .acts span:hover{background:var(--bd);color:var(--tx)}
    .grp{display:none}[aria-expanded=true]>.grp{display:block}
    .sb-f{padding:8px;border-top:1px solid var(--bd)}
    .collapsed{width:56px}
    .collapsed .lbl,.collapsed .tree,.collapsed .sb-f .lbl,.collapsed .ws,.collapsed .rs{display:none}
    .collapsed .sb-h{flex-direction:column;padding:12px 0}.collapsed .nv{justify-content:center}
    .main{flex:1;display:flex;flex-direction:column;min-width:0}
    .top{display:flex;align-items:center;gap:8px;padding:10px 18px;border-bottom:1px solid var(--bd);background:var(--bg)}
    .crumbs{display:flex;align-items:center;gap:4px;color:var(--tx2);min-width:0;flex:1;overflow:hidden;white-space:nowrap}
    .crumbs .ic{width:12px;height:12px;opacity:.6}.crumbs b{color:var(--tx);font-weight:500}
    .save{color:var(--tx2);font-size:12px;margin-right:6px}
    .scroll{flex:1;overflow:auto}
    .doc{max-width:720px;margin:0 auto;padding:44px 28px 80px}
    h1{font:700 38px/1.15 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;padding:2px 12px 12px}
    .card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:0;overflow:hidden}
    .card[aria-expanded=true]{grid-column:1/-1}
    .ch{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;cursor:pointer}
    .card.leaf .ch{padding:7px 10px}
    .ch>.ic{color:var(--ac);width:16px;height:16px}
    .ct{flex:1;text-align:left;font:600 15px var(--serif);color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ct:hover{text-decoration:underline}
    .cv{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--ac);flex:none}
    button.cv:hover{background:var(--acs)}
    .cv .ic{width:14px;height:14px;transition:transform .15s}
    [aria-expanded=true]>.ch .cv .ic{transform:rotate(90deg)}
    .cn{font-size:11.5px;color:var(--tx2);background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:0 8px}
    .cb{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:2px 12px 12px;align-items:start}
    .card:not([aria-expanded=true])>.cb{display:none}
    .dock{width:320px;flex:none;background:var(--sf);display:flex;flex-direction:column;order:3;border-left:1px solid var(--bd)}
    .dock.l{order:1;border-left:0;border-right:1px solid var(--bd)}.sb{order:0}.main{order:2}
    .dh{display:flex;align-items:center;gap:2px;padding:10px 8px 8px 14px}.dh b{flex:1;font:600 15px var(--serif)}
    .dm{flex:1;overflow:auto;padding:4px 10px 14px;display:flex;flex-direction:column;gap:8px}
    .dm .cb{grid-template-columns:1fr;padding:2px 8px 8px}.dm .ct{font-size:13.5px}.dm .ch{padding:6px 8px}
    [aria-pressed=true].btn-i{background:var(--acs);color:var(--ac)}
    @media(max-width:760px){.dock{display:none}.sb{position:fixed;z-index:9;height:100%;left:0;transform:translateX(-100%);transition:transform .2s}.sb.open{transform:none}.collapsed{width:var(--sw)}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.2-4.2"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v8a1 1 0 01-1 1h-4v-6h-6v6H5a1 1 0 01-1-1z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.6 .8-4 3.9.9 5.5-4.9-2.6-4.9 2.6.9-5.5-4-3.9 5.6-.8z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-lib" viewBox="0 0 24 24"><path d="M5 4h4v16H5zM11 4h4v16h-4zM17 6l3 .8-3.5 13-3-.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></symbol>
    <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 8h9M17 8h3M4 16h3M11 16h9"/><circle cx="15" cy="8" r="2"/><circle cx="9" cy="16" r="2"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7zM14 3v4h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M15 5v14"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="18" cy="12" r="1"/></symbol>
    <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 1110 4a7 7 0 0010 10z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="4" rx="1.5"/><rect x="13" y="10" width="7" height="10" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 9l-3 3 3 3M17 9l3 3-3 3"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </defs></svg>

  <div class="app" id="app">
    <!-- shell renderá aquí -->
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
